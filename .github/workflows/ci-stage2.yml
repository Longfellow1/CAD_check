name: CAD Integration CI

on:
  push:
    branches:
      - main
      - dev
      - 'dev-*'
  pull_request:

jobs:
  contract:
    name: PRD contract / Python-OCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Generate real AP242 controlled fixture
        run: python tools/generate_step_fixture.py
      - name: Run complete Python contract suite
        run: python -m pytest -q
      - name: Prove controlled 12/8 regression contract
        run: python tools/run_step_demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Renderer dependencies
        working-directory: web
        run: npm install
      - name: Build Electron Renderer bundle
        working-directory: web
        run: npm run build
      - name: Install Electron Main dependencies
        working-directory: desktop
        run: npm install
      - name: Check Electron Main/runtime contract
        working-directory: desktop
        run: npm run check
      - name: Assert product form and three-cad proxy-detail route
        shell: bash
        run: |
          grep -q "npm --prefix desktop start" start.sh
          ! grep -q "uvicorn" start.sh
          grep -q "NOT PRODUCT" scripts/start-web-dev.sh
          grep -q "three-cad-viewer" web/package.json
          ! grep -q "@xeokit/xeokit-sdk" web/package.json
          ! grep -q "@babylonjs" web/package.json
          grep -q "ThreeCadProductViewer" web/src/viewer/three_cad_product_viewer.js
          grep -q "proxy + normalized preview + demand detail" web/src/viewer/three_cad_product_viewer.js
          ! grep -q "/viewer/manifest" web/src/main_v4.js
          ! grep -q "create_streaming_router" server/app_v2.py
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-check-contract-evidence
          path: .cadcheck/runs
          if-no-files-found: ignore

  electron-e2e:
    name: Electron E2E / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Register Python executable for Electron Runtime
        run: python -c "import os,sys; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('CAD_CHECK_PYTHON='+sys.executable+'\n')"
      - name: Generate AP242 fixture
        run: python tools/generate_step_fixture.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Renderer dependencies
        working-directory: web
        run: npm install
      - name: Build Renderer
        working-directory: web
        run: npm run build
      - name: Install Electron shell
        working-directory: desktop
        run: npm install
      - name: Electron static/runtime tests
        working-directory: desktop
        run: npm run check
      - name: Run real Electron E2E on Linux
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a npm run e2e -- --no-sandbox
      - name: Run real Electron E2E on macOS / Windows
        if: runner.os != 'Linux'
        working-directory: desktop
        run: npm run e2e
      - name: Verify Electron delivery report
        run: python tools/verify_electron_e2e.py
      - name: Upload Electron E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-${{ runner.os }}
          path: |
            .cadcheck/e2e
            .cadcheck/runs
          if-no-files-found: ignore
