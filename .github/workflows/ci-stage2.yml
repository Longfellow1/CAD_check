name: Stage-2 STEP OCCT CI
on:
  push:
    branches: [mvp-v0.2-step-occt]
  pull_request:
jobs:
  stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.lock.txt
      - run: python tools/generate_step_fixture.py
      - run: python tools/readiness.py
      - run: pytest -q tests/test_stage2_step.py
      - run: python tools/run_step_demo.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install && npm run build
        working-directory: web
