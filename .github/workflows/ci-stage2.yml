name: Stage-2 STEP OCCT CI

on:
  push:
    branches:
      - mvp-v0.2-step-occt
      - gpt/mvp-real-cad-p0
  pull_request:

jobs:
  stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Generate real AP242 controlled fixture
        run: python tools/generate_step_fixture.py
      - name: Readiness must fail closed
        run: python tools/readiness.py
      - name: Run P0 test suite
        run: python -m pytest -q
      - name: Prove controlled 12/8 regression contract
        run: python tools/run_step_demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build three-cad-viewer workspace
        run: npm install && npm run build
        working-directory: web
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-check-stage2-evidence
          path: .cadcheck/runs
          if-no-files-found: ignore
