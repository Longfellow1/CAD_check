name: CAD Integration CI

on:
  push:
    branches:
      - main
      - dev
      - 'dev-*'
  pull_request:

jobs:
  cad-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Generate real AP242 controlled fixture
        run: python tools/generate_step_fixture.py
      - name: Readiness must fail closed
        run: python tools/readiness.py
      - name: Run P0 test suite and product-form contract
        run: python -m pytest -q
      - name: Prove controlled 12/8 regression contract
        run: python tools/run_step_demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Electron Renderer bundle
        run: npm install && npm run build
        working-directory: web
      - name: Check Electron Main/runtime contract
        run: npm install && npm run check
        working-directory: desktop
      - name: Assert primary launcher is Electron
        shell: bash
        run: |
          grep -q "npm --prefix desktop start" start.sh
          ! grep -q "uvicorn" start.sh
          grep -q "NOT PRODUCT" scripts/start-web-dev.sh
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-check-integration-evidence
          path: .cadcheck/runs
          if-no-files-found: ignore
